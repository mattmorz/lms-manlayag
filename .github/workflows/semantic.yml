name: Semantic Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # This workflow contains a single job called "build"
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      - name: Validate title format
        run: |
          title="${{ github.event.pull_request.title }}"
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?(!)?:[[:space:]]+.+$'
          if [[ ! "$title" =~ $pattern ]]; then
            echo "Invalid PR title: $title"
            echo "Expected Conventional Commits format, e.g., 'fix(scope): brief description'."
            exit 1
          fi
