name: Linters

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  commit-lint:
    name: 'Semantic Commits'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          copilot_email_suffix='Copilot@users.noreply.github.com'

          for commit in $(git rev-list --reverse ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            subject=$(git log -1 --format=%s "$commit")
            author_email=$(git log -1 --format=%ae "$commit")

            case "$subject" in
              "Initial plan"|"Plan "*)
                if [[ "$author_email" == *"$copilot_email_suffix" ]]; then
                  echo "Skipping Copilot progress commit: $commit - $subject"
                  continue
                fi
                ;;
            esac

            echo "Checking commit: $commit - $subject"
            git log -1 --format=%B "$commit" | npx commitlint --verbose
          done

  linters:
    name: Semgrep Rules
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and Run Pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Download semgrep
        run: pip install semgrep

      - name: Run Semgrep rules
        run: semgrep ci --config ./frappe-semgrep-rules/rules